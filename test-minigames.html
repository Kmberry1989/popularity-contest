    await sleep(100);

  });
  // sort: click correct bucket 3 times
  await runOne('sort', async()=>{
    for(let round=0; round<3; round++){
      await sleep(100);
      let name=nameFromTile(document.querySelector('#miniPlay'));
      // tileImg first div is the item tile, its name div is second level
      let tile=document.querySelector('#miniPlay > div');
      let nm=tile.querySelector('div').textContent.trim();
      let b=bucketOf(nm);
      let btn=[...document.querySelectorAll('#miniPlay [data-b]')].find(x=>x.dataset.b===b);
      if(!btn) throw new Error('no bucket btn for '+nm+'/'+b);
      click(btn);
    }
  });
  // spotpair: click two tiles with same image src
  await runOne('spotpair', async()=>{
    let tiles=[...document.querySelectorAll('#miniPlay [data-i]')];
    let srcs=tiles.map(t=>t.querySelector('img').src);
    let dup=srcs.find(src=>srcs.filter(s=>s===src).length===2);
    let idxs=srcs.map((s,i)=>s===dup?i:-1).filter(i=>i>=0);
    click(tiles[idxs[0]]); await sleep(100); click(tiles[idxs[1]]);
  });
  // missing: brute force options over up to 3 runs
  let missingOk=false;
  for(let attempt=0; attempt<3 && !missingOk; attempt++){
    finished=false; window._miniDone=false;
    try{
      playMini('missing'); await sleep(2700);
      let opts=[...document.querySelectorAll('#miniPlay [data-t]')];
      if(!opts.length) throw new Error('no options');
      click(opts[attempt % opts.length]);
      missingOk=await waitFinish(2000);
    }catch(e){ log('missing-attempt',false,e.message) }
  }
  log('missing', missingOk, missingOk?'finished on an attempt':'never finished');
  // arrow: click right arrow 3 times
  await runOne('arrow', async()=>{
    for(let i=0;i<3;i++){ await sleep(100); let btn=[...document.querySelectorAll('#miniPlay [data-a]')].find(x=>+x.dataset.a===3); click(btn); }
  });
  // ballsort: BFS solver, click tubes
  await runOne('ballsort', async()=>{
    // read tubes from DOM: each tube div has balls as colored divs in DOM order (bottom to top? DOM order is array order)
    function readTubes(){
      return [...document.querySelectorAll('#miniPlay [data-t]')].map(t=>{
        let balls=[...t.querySelectorAll('div div')].map(d=>d.style.background).filter(Boolean);
        // DOM order is array order, top is last
        return balls;
      });
    }
    // BFS in color space, using DOM reads after each move is complex; instead solve from initial state known in code: RBG, BGR, GRB, empty
    // Use a generic BFS on state strings, then execute moves, re-reading after each pick/drop
    let state=[['red','blue','green'],['blue','green','red'],['green','red','blue'],[]];
    function key(s){return s.map(t=>t.join(',')).join('|')}
    function win(s){return s.every(t=>t.length===0||t.every(c=>c===t[0]))}
    function bfs(start){
      let q=[[start,[]]], seen=new Set([key(start)]);
      while(q.length){let [s,path]=q.shift(); if(win(s)) return path; for(let i=0;i<s.length;i++){ if(!s[i].length) continue; let top=s[i][s[i].length-1]; for(let j=0;j<s.length;j++){ if(i===j) continue; if(s[j].length===0||s[j][s[j].length-1]===top){ let ns=s.map(t=>[...t]); ns[i].pop(); ns[j].push(top); let k=key(ns); if(!seen.has(k)){seen.add(k); q.push([ns,[...path,[i,j]]])} } } } }
      return null;
    }
    let plan=bfs(state);
    if(!plan) throw new Error('no BFS plan');
    for(let [from,to] of plan){
      let tubes=[...document.querySelectorAll('#miniPlay [data-t]')];
      click(tubes[from]); await sleep(150);
      tubes=[...document.querySelectorAll('#miniPlay [data-t]')];
      click(tubes[to]); await sleep(150);
    }
  });
  // scramble: find word matching scrambled letters
  await runOne('scramble', async()=>{
    let txt=document.querySelector('#miniPlay').textContent;
    let m=txt.match(/Unscramble:\s*([A-Z ]+)/);
    let scr=(m[1].replace(/ /g,'')).split('');
    let cand=null;
    for(let pr of PAIRS){ for(let nm of [pr[0],pr[1]]){ let w=nm.toUpperCase().replace(/ /g,''); if(w.length===scr.length && w.split('').sort().join('')===scr.slice().sort().join('')){cand=w;break} } if(cand) break }
    if(!cand) throw new Error('no word for '+scr.join(''));
    let btns=[...document.querySelectorAll('#miniPlay [data-i]')];
    // buttons show scrambled letters in order, need to click in cand order, handling duplicates by using each button once
    let used=new Set();
    for(let ch of cand){
      let b=btns.find((x,i)=>!used.has(i)&&x.textContent.trim()===ch);
      if(!b) throw new Error('no letter '+ch);
      used.add(btns.indexOf(b)); click(b); await sleep(50);
    }
  });
  // connect: C O Z Y
  await runOne('connect', async()=>{
    let btns=[...document.querySelectorAll('#miniPlay [data-i]')];
    for(let ch of 'COZY'){ let b=btns.find(x=>x.textContent.trim()===ch && !x.style.opacity); if(!b) b=btns.find(x=>x.textContent.trim()===ch); click(b); await sleep(50); }
  });
  // simon: record lit pads during playback, then repeat, until finish (pattern 5)
  // playSimon is not in playMini's simon branch? it is: playSimon(el)
  // For test, run simon and attempt recording for up to 6 rounds
  finished=false; window._miniDone=false;
  try{
    playMini('simon'); await sleep(300);
    for(let round=0; round<6 && !finished; round++){
      // wait for playback to start and collect lit pads
      let seq=[]; let last=-1; let idle=0;
      // poll opacity for up to 6 seconds, collecting transitions to opacity 1
      let t0=Date.now();
      while(Date.now()-t0<6000){
        let pads=[...document.querySelectorAll('#miniPlay .simonbtn')];
        if(!pads.length) break;
        pads.forEach((p,i)=>{ if(p.style.opacity==='1' && last!==i){ seq.push(i); last=i; } else if(p.style.opacity!=='1' && last===i){ /* keep last until next */ } });
        let msg=document.getElementById('simonMsg');
        if(msg && msg.textContent==='Your turn') break;
        await sleep(80);
      }
      // click recorded sequence, deduplicate consecutive? playback lights each beat once, so seq may have duplicates from polling - compress consecutive duplicates
      let comp=[]; seq.forEach(x=>{ if(comp[comp.length-1]!==x) comp.push(x) });
      // If comp is empty, break
      if(!comp.length) break;
      let pads=[...document.querySelectorAll('#miniPlay .simonbtn')];
      for(let idx of comp){ click(pads[idx]); await sleep(200); }
      await sleep(500);
      finished=await waitFinish(200);
      if(finished) break;
    }
    log('simon', finished, finished?'finished':'no finish after recording attempts');
  }catch(e){ log('simon', false, 'error '+e.message) }
  // hammer
  await runOne('hammer', async()=>{ for(let i=0;i<5;i++){ click(document.getElementById('hammerBtn')); await sleep(50); } });
  // balloon: hold ~1s, release in zone
  await runOne('balloon', async()=>{
    let b=document.getElementById('balloon');
    b.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
    await sleep(1000);
    b.dispatchEvent(new PointerEvent('pointerup',{bubbles:true}));
  });
  // paint: pointerdown + moves
  await runOne('paint', async()=>{
    let w=document.getElementById('wall');
    w.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
    for(let i=0;i<12;i++){ w.dispatchEvent(new PointerEvent('pointermove',{bubbles:true})); await sleep(30); }
    w.dispatchEvent(new PointerEvent('pointerup',{bubbles:true}));
  });
  document.getElementById('summary').textContent = 'DONE ' + results.filter(r=>r.ok).length + '/' + results.length + ' passed';
}
window.addEventListener('load', testAll);

</script></body></html>
