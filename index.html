*{box-sizing:border-box}html,body{height:100dvh;overflow:hidden;margin:0;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff8ef,#ffe9c9);color:#3b2a1e}
.screen{height:100dvh;width:100%;display:none!important;flex-direction:column;overflow:hidden;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.screen.active{display:flex!important}
button{border:3px solid #e8c9a0;border-radius:12px;background:#ffe9c9;color:#3b2a1e;padding:14px 22px;font-size:18px;font-weight:800;min-height:52px;cursor:pointer;box-shadow:0 3px 0 #d9a86a}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #d9a86a}
button.big{width:100%;padding:20px;font-size:22px;background:#ff8a3d;color:#3b2a1e}
button.small{padding:8px 14px;font-size:15px;min-height:40px;background:#fff}
input{width:100%;padding:12px;border-radius:12px;border:2px solid #e8c9a0;font-size:17px;color:#3b2a1e}
.dots{display:flex;gap:8px;justify-content:center;padding:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#e8c9a0}.dot.on{background:#ff8a3d}
.pairwrap{flex:1;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;touch-action:none}
.opt{flex:1;border:3px solid #e8c9a0;border-radius:22px;overflow:hidden;background:#fffdf6;transition:transform .2s,opacity .2s,border-color .2s;display:flex;flex-direction:column}
.opt img{width:100%;flex:1;object-fit:contain;min-height:0;background:#fffdf6}
.opt b{padding:10px;text-align:center;font-size:18px}
.opt.chosen{border-color:#ff8a3d;transform:scale(1.03);box-shadow:0 0 0 4px rgba(255,138,61,.3)}
.opt.dim{opacity:.35;transform:scale(.96)}
.confirmbar{display:none;padding:10px;background:#fffdf6;border:3px solid #e8c9a0;border-radius:20px;margin-top:10px;align-items:center;gap:10px}
.confirmbar.show{display:flex}
.confirmbar img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.slideout-left{transform:translateX(-110%);transition:transform .45s ease}
.slideout-right{transform:translateX(110%);transition:transform .45s ease}
.slidein{animation:slidein .45s ease}@keyframes slidein{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}
.revealrow{display:flex;gap:10px;margin:8px 0}
.revealcard{flex:1;border:3px solid #e8c9a0;border-radius:16px;padding:8px;text-align:center;background:#fffdf6}
.revealcard img{width:100%;height:90px;object-fit:contain;border-radius:10px;background:#fffdf6}
.scroll{overflow:auto;flex:1}
.card{background:#fffdf6;border:3px solid #e8c9a0;border-radius:20px;padding:12px;margin:8px 0}

.float{position:fixed;width:28px;height:28px;border-radius:50%;background:rgba(255,138,61,.25);z-index:0;animation:floaty 7s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-24px) rotate(20deg)}}
.screen{position:relative;z-index:1}
.playgraphic{width:140px;height:140px;border:0;background:transparent;box-shadow:none!important;padding:0;animation:bob 2.2s ease-in-out infinite}
.playgraphic:hover{transform:scale(1.08)} .playgraphic:active{transform:scale(.92)}
.playgraphic img{width:100%;height:100%;object-fit:contain;filter:none!important;box-shadow:none!important}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
#confirmBtn{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.holdfill{position:absolute;left:0;bottom:0;width:100%;height:0%;background:rgba(76,175,80,.45);z-index:2;pointer-events:none}
.opt{position:relative}

@keyframes rumble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(2px,-2px) rotate(.6deg)}50%{transform:translate(-2px,2px) rotate(-.6deg)}75%{transform:translate(2px,2px) rotate(.4deg)}100%{transform:translate(0,0) rotate(0)}}
.opt.holding{animation:rumble .18s linear infinite;border-color:#4caf50;box-shadow:0 0 0 5px rgba(76,175,80,.5),0 0 24px rgba(76,175,80,.8);transform:scale(1.04)}
.opt.holding img{transform:scale(1.06)}
.opt.glow{border-color:#ff8a3d;box-shadow:0 0 0 6px rgba(255,138,61,.6),0 0 32px rgba(255,138,61,.9);transform:scale(1.05)}
.opt.locked{animation:lockedpop .6s ease}
@keyframes lockedpop{0%{transform:scale(1)}30%{transform:scale(1.12);box-shadow:0 0 0 10px rgba(255,138,61,.7),0 0 44px rgba(255,138,61,1)}60%{transform:scale(.96)}100%{transform:scale(1.05)}}
.opt img{transition:transform .2s}

#guessBanner{display:none;text-align:center;font-size:32px;font-weight:900;padding:10px;background:#7b5cff;color:#fff;border-radius:12px;margin-bottom:10px}
#pairScreen.guessmode{background:linear-gradient(180deg,#e8e0ff,#d6c8ff)}
#pairScreen.guessmode #guessBanner{display:block}
#guessBtn{display:none}


.processstep{font-size:20px;font-weight:800;padding:14px;margin:8px 0;border-radius:12px;background:#fffdf6;border:3px solid #e8c9a0;opacity:.35;transition:all .4s}
.processstep.on{opacity:1;border-color:#ff8a3d;transform:scale(1.03);box-shadow:0 0 20px rgba(255,138,61,.5)}
.processstep.done{opacity:1;border-color:#4caf50}
@keyframes sealpop{0%{transform:scale(2) rotate(-12deg);opacity:0}60%{transform:scale(.9) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.seal{animation:sealpop .6s ease}
@keyframes shuffle{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-20px) rotate(-6deg)}50%{transform:translateX(20px) rotate(6deg)}75%{transform:translateX(-10px) rotate(-3deg)}100%{transform:translateX(0) rotate(0)}}
.shuffling{animation:shuffle .5s ease infinite}
</style></head><body>
<div class="screen active" id="menuScreen">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
<img src="title.png" alt="" style="width:100%;max-width:480px;display:block;position:relative;z-index:1">

<button class="small" id="guessBtn">Guess</button>

<div id="waitingDetail" style="font-size:17px"></div>
<button id="inviteBtn">Invite</button>

</div></div>

<div class="screen" id="processScreen">
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px">

<div class="processstep" id="step2">Shuffling</div>
<div class="processstep" id="step3">Saving</div>
</div></div>
<div class="screen" id="revealScreen">
<div style="font-size:22px;font-weight:800;text-align:center;padding:8px">Reveal</div>
<div class="scroll" id="revealList"></div>
<button class="big" id="nextRunBtn">Next 5</button>
<button class="small" id="revealMenuBtn">Menu</button><button class="small" id="moreBtn2">⋯</button>
</div>

<div class="screen" id="guessDoneScreen">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
<div id="guessDoneName" style="font-size:32px;font-weight:900"></div>
<div class="scroll" id="guessDoneList" style="width:100%"></div>
<button class="small" id="guessDoneMenuBtn">Menu</button>
</div></div>
<div class="screen" id="soloScreen">
<div style="font-size:22px;font-weight:800;text-align:center;padding:8px">Your picks</div>
<div class="scroll" id="soloList"></div>
<button class="big" id="soloNextBtn">Next 5</button>
<button class="small" id="soloMenuBtn">Menu</button>
</div>
<div class="screen" id="moreScreen">
<div style="font-size:22px;font-weight:800;text-align:center">More</div>
<div class="scroll">
<div class="card"><div style="font-weight:800;font-size:18px" id="surveyQ"></div><div id="surveyOpts" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div><div id="surveyDone"></div></div>
<div class="card"><div style="font-weight:800">Friends</div><div id="friendsList"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="friendName"><button id="addFriendBtn">+</button></div><div id="chatBox" style="display:none"><div id="chatTitle"></div><div id="chatMsgs"></div><div style="display:flex;gap:8px"><input id="chatInput"><button id="sendMsgBtn">Send</button></div></div></div>
<div class="card"><div style="font-weight:800">Feed</div><div id="feedBox"></div></div>
</div>
<button class="small" id="moreBackBtn">Back</button>
</div>

let ctx=null,soundOn=true;
function beep(f=600,d=.12,type='sine',g=.15){if(!soundOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,ctx.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(gn);gn.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}catch(e){}}

let rumbleOsc=null,rumbleGain=null;
function startRumble(){if(!soundOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();stopRumble();rumbleOsc=ctx.createOscillator();rumbleGain=ctx.createGain();rumbleOsc.type='sawtooth';rumbleOsc.frequency.value=55;rumbleGain.gain.setValueAtTime(0.01,ctx.currentTime);rumbleGain.gain.linearRampToValueAtTime(0.28,ctx.currentTime+2);rumbleOsc.connect(rumbleGain);rumbleGain.connect(ctx.destination);rumbleOsc.start();}catch(e){}}
function stopRumble(){try{if(rumbleOsc){rumbleOsc.stop();rumbleOsc=null}if(rumbleGain){rumbleGain.disconnect();rumbleGain=null}}catch(e){}}
function padNote(f,dur,type='sine',g=.03,attack=1.2){if(!soundOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.value=f;let t=ctx.currentTime;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+attack);gn.gain.setValueAtTime(g,t+dur-1);gn.gain.linearRampToValueAtTime(0,t+dur);o.connect(gn);gn.connect(ctx.destination);o.start(t);o.stop(t+dur);}catch(e){}}
let bgmOn=false;function startBgm(){if(bgmOn)return;bgmOn=true;let chords=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,392]];let melody=[523.3,587.3,659.3,783.99,659.3,587.3,493.9,440];let m=0;function measure(){if(!soundOn){setTimeout(measure,4000);return}let ch=chords[m%4];ch.forEach(f=>padNote(f,5.5,'sine',.028,1.4));padNote(ch[0]/2,5.5,'sine',.035,0.8);if(m%2===0){let n=melody[(m/2)%melody.length];setTimeout(()=>padNote(n,3,'triangle',.02,1),1200)}m++;setTimeout(measure,4000)}measure()}

$('soloMenuBtn').onclick=()=>show('menuScreen');
function checkReveal(){if(document.getElementById('waitingScreen').classList.contains('active')){let pairs=runPairs();if(pairs.every(p=>myPicks[p.id]&&partnerPicks[p.id]))showReveal()}}
function showReveal(){show('revealScreen');let pairs=runPairs();$('revealList').innerHTML='';drumRoll();pairs.forEach((p,i)=>{let you=myPicks[p.id],them=partnerPicks[p.id];let match=you===them;let row=document.createElement('div');row.className='revealrow';row.innerHTML=`<div class="revealcard"><img src="${IMG[you]||''}"><div>You: ${you}</div></div><div class="revealcard"><img src="${IMG[them]||''}"><div>Them: ${them}</div></div>`;$('revealList').appendChild(row);setTimeout(()=>{if(match)trumpet();else trombone()},1200+i*600)})}
$('playBtn').onclick=async()=>{guessMode=false;startBgm();await ensureRoom();syncRoom();runIdx=0;show('pairScreen');renderPair()};
let showMore=()=>{show('moreScreen');renderSurvey();renderFriends();renderFeed()};if($('moreBtn'))$('moreBtn').onclick=showMore;$('moreBtn2').onclick=showMore;$('moreBtn3').onclick=showMore;
$('moreBackBtn').onclick=()=>show('menuScreen');
$('waitMenuBtn').onclick=()=>show('menuScreen');
$('revealMenuBtn').onclick=()=>show('menuScreen');
$('nextRunBtn').onclick=async()=>{runStart=(runStart+5)%PAIRS.length;if(db&&roomId){try{await updateDoc(roomRef(),{runStart})}catch(e){}}runIdx=0;show('pairScreen');renderPair()};
$('inviteBtn').onclick=async()=>{let url=location.href.split('?')[0]+(roomId?'?room='+roomId:'');let text='Play Popularity Contest with me!';if(navigator.share){try{await navigator.share({title:"Popularity Contest",text,url});return}catch(e){}}try{await navigator.clipboard.writeText(text+' '+url)}catch(e){location.href='sms:?body='+encodeURIComponent(text+' '+url)}};
$('checkBtn').onclick=()=>{syncRoom();setTimeout(checkReveal,500)};
function showGuessDone(){show('guessDoneScreen');$('guessDoneName').textContent=guessFriend;$('guessDoneList').innerHTML=guessPairs.map(pr=>`<div class="card"><img src="${IMG[guessPicks[pr.id]]||''}" style="width:100%;height:120px;object-fit:contain"><div style="font-weight:800">${guessPicks[pr.id]||''}</div></div>`).join('')}
$('guessBtn').onclick=()=>{let f=JSON.parse(localStorage.getItem('tot_friends')||'[]');if(!f.length)return;guessFriend=f[Math.floor(Math.random()*f.length)];guessMode=true;guessPicks={};let shuffled=[...PAIRS].sort(()=>Math.random()-.5).slice(0,5);guessPairs=shuffled.map((pr,i)=>({id:'g'+i,a:pr[0],b:pr[1],bucket:pr[4]}));startBgm();runIdx=0;show('pairScreen');renderPair()};
$('guessDoneMenuBtn').onclick=()=>{guessMode=false;show('menuScreen')};
function updateGuessBtn(){$('guessBtn').style.display='none'}
updateGuessBtn();
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{let now=Date.now();if(now-lastTap<350)e.preventDefault();lastTap=now},{passive:false});
function renderSurvey(){let day=Math.floor(Date.now()/86400000);let q=SURVEYS[day%SURVEYS.length];let key='tot_survey_'+day;let ans=localStorage.getItem(key);$('surveyQ').textContent=q[0];$('surveyOpts').innerHTML=q[1].map((o,i)=>`<button ${ans?'disabled':''} onclick="window.answerSurvey(${i})">${o}</button>`).join('');$('surveyDone').textContent=ans?('Picked: '+q[1][ans]):''}
window.answerSurvey=i=>{let day=Math.floor(Date.now()/86400000);localStorage.setItem('tot_survey_'+day,String(i));renderSurvey()};
let friends=JSON.parse(localStorage.getItem('tot_friends')||'[]');let chats=JSON.parse(localStorage.getItem('tot_chats')||'{}');let currentFriend=null;
function renderFriends(){let el=$('friendsList');el.innerHTML=friends.map((f,i)=>`<button class="small" onclick="window.openChat(${i})">${f}</button>`).join(' ')||''}
window.openChat=i=>{currentFriend=friends[i];$('chatBox').style.display='block';$('chatTitle').textContent='Chat with '+currentFriend;$('chatMsgs').innerHTML=(chats[currentFriend]||[]).map(m=>`<p>${m}</p>`).join('')};
$('addFriendBtn').onclick=()=>{let n=$('friendName').value.trim();if(!n)return;if(!friends.includes(n))friends.push(n);localStorage.setItem('tot_friends',JSON.stringify(friends));$('friendName').value='';renderFriends();updateGuessBtn()};
$('sendMsgBtn').onclick=()=>{if(currentFriend==null)return;let t=$('chatInput').value.trim();if(!t)return;chats[currentFriend]=chats[currentFriend]||[];chats[currentFriend].push('You: '+t);localStorage.setItem('tot_chats',JSON.stringify(chats));$('chatInput').value='';window.openChat(friends.indexOf(currentFriend))};
function renderFeed(){let total=Object.keys(myPicks).length;$('feedBox').innerHTML=`<p>Picks made: ${total}</p><p>No picks revealed here.</p>`}
renderSurvey();
</script></body></html>
