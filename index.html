<style>

header{padding:12px;text-align:center;background:#ffe9c9;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px} .sub{font-size:13px;opacity:.8}
.wrap{max-width:520px;margin:0 auto;padding:14px}

button{border:0;border-radius:999px;padding:12px 18px;font-size:16px;background:#ff8a3d;color:#fff;cursor:pointer;font-weight:700}
button.sec{background:#fff;color:#3b2a1e;border:2px solid #e8c9a0}
button:active{transform:scale(.96)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid #e8c9a0;border-radius:18px;padding:14px;text-align:center;background:#fffdf6;cursor:pointer;transition:transform .18s}
.opt:hover{transform:translateY(-3px) scale(1.02)} .opt.picked{border-color:#ff8a3d;background:#ffe9c9;animation:squish .4s}
.emoji{font-size:56px;display:block;animation:hoverBob 2.2s ease-in-out infinite}
@keyframes hoverBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(.92,1.08)}60%{transform:scale(1.08,.92)}100%{transform:scale(1)}}
@keyframes bounceIn{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.5)}50%{box-shadow:0 0 0 12px rgba(255,138,61,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.avatar{width:110px;height:110px;object-fit:cover;border-radius:50%;border:4px solid #ff8a3d;animation:hoverBob 2.4s infinite}
.avatar.happy{animation:jump .6s} .avatar.sad{animation:shake .5s} .avatar.celebrate{animation:jump .5s 3}
.meter{height:18px;background:#eee;border-radius:999px;overflow:hidden} .meter>div{height:100%;background:linear-gradient(90deg,#ff8a3d,#ff5d8f);transition:width .6s}
.slot{font-size:44px;text-align:center;letter-spacing:8px}
input{width:100%;padding:12px;border-radius:12px;border:2px solid #e8c9a0;font-size:16px}
.small{font-size:13px;opacity:.8} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;background:#ffe9c9;border:2px solid #e8c9a0;border-radius:999px;padding:4px 10px;margin:3px;font-size:13px}
#capsuleBox{font-size:64px;text-align:center} #capsuleBox.rumble{animation:shake .2s infinite}
.coin{width:56px;height:56px;border-radius:50%;background:gold;border:3px solid #c90;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:grab;touch-action:none}
.hidden{display:none}

.target.over{border-style:solid;background:#ffe9c9;animation:pulseGlow 1s infinite}
.opt.glow{animation:pulseGlow 1.6s infinite}
.opt.dragging{position:relative;z-index:10;transform:scale(1.1);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.flipscene{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:800px}
.flip{position:relative;height:140px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.flip.flipped{transform:rotateY(180deg)}

.revealstage{text-align:center;animation:bounceIn .6s}
.revealstage.dim{filter:brightness(.95)}

$('roundLabel').textContent=phase==='pairs'?('Round 1 • Pair '+(currentIdx+1)+' / '+PAIRS.length):'🏆 • '+(bracketQueue.length)+' left';
$('turnLabel').textContent=myPicks[m.id]?'✓ You picked — waiting for partner':'Your turn';
let box=$('pairBox');box.innerHTML='';
const IMG={"Blanket fort":"img/cozy-blanket-fort.webp","Porch swing":"img/cozy-porch-swing.webp","Fireplace":"img/cozy-fireplace.webp","String lights":"img/cozy-string-lights.webp","Reading nook":"img/cozy-reading-nook.webp","Bubble bath":"img/cozy-bubble-bath.webp","Fuzzy socks":"img/cozy-fuzzy-socks.webp","Cozy sweater":"img/cozy-sweater.webp","Candlelight":"img/cozy-candlelight.webp","Rainy window":"img/cozy-rainy-window.webp","Rocking chair":"img/cozy-rocking-chair.webp","Hammock":"img/cozy-hammock.webp","Slippers":"img/cozy-slippers.webp","Robe":"img/cozy-robe.webp","Teacup":"img/cozy-teacup.webp","Coffee mug":"img/cozy-coffee-mug.webp","Quilt":"img/cozy-quilt.webp","Throw pillows":"img/cozy-throw-pillows.webp","Armchair":"img/cozy-armchair.webp","Beanbag":"img/cozy-beanbag.webp","Lantern":"img/cozy-lantern.webp","Fairy jar":"img/cozy-fairy-jar.webp","Tea kettle":"img/cozy-tea-kettle.webp","French press":"img/cozy-french-press.webp","Nightlight":"img/cozy-nightlight.webp","Dreamcatcher":"img/cozy-dreamcatcher.webp","Cabin":"img/cozy-cabin.webp","Cottage":"img/cozy-cottage.webp","Bookshelf":"img/cozy-bookshelf.webp","Mug shelf":"img/cozy-mug-shelf.webp","Sofa":"img/cozy-sofa.webp","Loveseat":"img/cozy-loveseat.webp","Ottoman":"img/cozy-ottoman.webp","Footstool":"img/cozy-footstool.webp","Curtains":"img/cozy-curtains.webp","Blinds":"img/cozy-blinds.webp","Fire pit":"img/cozy-fire-pit.webp","Sauna":"img/cozy-sauna.webp","Window seat":"img/cozy-window-seat.webp","Balcony":"img/cozy-balcony.webp","Daybed":"img/cozy-daybed.webp","Futon":"img/cozy-futon.webp","Pajamas":"img/cozy-pajamas.webp","Loungewear":"img/cozy-loungewear.webp","Throw rug":"img/cozy-throw-rug.webp","Sheepskin rug":"img/cozy-sheepskin-rug.webp","Dresser":"img/cozy-dresser.webp","Vanity":"img/cozy-vanity.webp","Attic nook":"img/cozy-attic-nook.webp","Basement den":"img/cozy-basement-den.webp"};
[[m.a,m.ea,0],[m.b,m.eb,1]].forEach(([label,emoji,side])=>{let d=document.createElement('div');d.className='opt glow'+(myPicks[m.id]===label?' picked':'');d.innerHTML=IMG[label]?`<img src="${IMG[label]}" style="width:100%;height:120px;object-fit:cover;border-radius:12px"><b>${label}</b>`:`<span class="emoji">${emoji}</span><b>${label}</b>`;d.style.touchAction='none';
d.onclick=()=>{if(myPicks[m.id])return;pendingPick=label;$('confirmBtn').disabled=false;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked'));d.classList.add('picked');sfx('tap')};
let sx=0,sy=0,dx=0,dy=0,dragging=false;
d.addEventListener('pointerdown',e=>{if(myPicks[m.id])return;dragging=true;sx=e.clientX;sy=e.clientY;d.classList.add('dragging');d.setPointerCapture(e.pointerId)});
d.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-sx;dy=e.clientY-sy;d.style.transform=`translate(${dx}px,${dy}px) scale(1.1)`;let t=$('targetBox').getBoundingClientRect(),r=d.getBoundingClientRect();let over=!(r.bottom<t.top||r.top>t.bottom||r.right<t.left||r.left>t.right);$('targetBox').classList.toggle('over',over)});
d.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;d.classList.remove('dragging');d.style.transform='';let t=$('targetBox').getBoundingClientRect(),r=d.getBoundingClientRect();let over=!(r.bottom<t.top||r.top>t.bottom||r.right<t.left||r.left>t.right);if(over){pendingPick=label;$('confirmBtn').disabled=false;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('picked'));d.classList.add('picked');sfx('pop');$('targetBox').classList.remove('over')}});
box.appendChild(d)});
$('confirmBtn').onclick=()=>{if(pendingPick)pick(pendingPick,m)};
let rev=$('revealBox');
if(myPicks[m.id]&&partnerPicks[m.id]){rev.classList.remove('hidden');let match=myPicks[m.id]===partnerPicks[m.id];let youEmoji=m.ea, themEmoji=m.eb;
if(revealedId===m.id){rev.innerHTML=`<p>${match?'💖 Match!':'💛 Different picks'} — You: ${myPicks[m.id]} • Them: ${partnerPicks[m.id]}</p><button id="nextBtn">Next →</button>`;rev.querySelector('#nextBtn').onclick=nextMatchup;}
else{revealedId=m.id;
if(myPicks[m.id]===m.b){youEmoji=m.eb} if(partnerPicks[m.id]===m.b){themEmoji=m.eb} if(partnerPicks[m.id]===m.a){themEmoji=m.ea}
rev.innerHTML=`<div class="revealstage"><p style="font-size:28px">🥁 Drum roll…</p><div class="flipscene"><div class="flip" id="flipYou"><div><span style="font-size:48px">❓</span><b>You</b></div><div class="back">${IMG[myPicks[m.id]]?`<img src="${IMG[myPicks[m.id]]}" style="width:100%;height:90px;object-fit:cover;border-radius:12px">`:`<span style="font-size:48px">${youEmoji}</span>`}<b>${myPicks[m.id]}</b></div></div><div class="flip" id="flipThem"><div><span style="font-size:48px">❓</span><b>Them</b></div><div class="back">${IMG[partnerPicks[m.id]]?`<img src="${IMG[partnerPicks[m.id]]}" style="width:100%;height:90px;object-fit:cover;border-radius:12px">`:`<span style="font-size:48px">${themEmoji}</span>`}<b>${partnerPicks[m.id]}</b></div></div></div><p id="revealResult" style="font-size:20px">…</p><button id="nextBtn" class="hidden">Next →</button></div>`;
drumRoll();
setTimeout(()=>{document.getElementById('flipYou').classList.add('flipped')},600);
setTimeout(()=>{document.getElementById('flipThem').classList.add('flipped')},1100);
setTimeout(()=>{let r=$('revealResult');if(match){r.textContent='💖 Match! Trumpet!';trumpet();avatarReact('celebrate')}else{r.textContent='💛 Different picks — low trombone';trombone();avatarReact('sad')}$('nextBtn').classList.remove('hidden')},1700);
rev.querySelector('#nextBtn').onclick=nextMatchup;}}
else rev.classList.add('hidden');
}
async function pick(label,m){
if(myPicks[m.id])return;sfx('tap');myPicks[m.id]=label;addXp(5);if(!badgesList.includes('First Pick'))unlockBadge('First Pick');
if(db&&roomId){try{let ref=roomRef(),snap=await getDoc(ref);let picks=snap.data()?.picks||{};picks[user?.uid||'guest']=myPicks;await updateDoc(ref,{picks});}catch(e){}}
render();updateSimilarity();
if(myPicks[m.id]&&partnerPicks[m.id]){sfx(myPicks[m.id]===partnerPicks[m.id]?'match':'soft');if(myPicks[m.id]===partnerPicks[m.id]){unlockBadge('Match Maker');addXp(10)}}
}
function nextMatchup(){
if(phase==='pairs'){currentIdx++;if(currentIdx>=PAIRS.length){startBracket()}else if(currentIdx%25===0){showSlot()}}
else{bracketQueue.shift();if(!bracketQueue.length){startFinalOrEnd()}}
render();
}
function startBracket(){
// per bucket, winners in order, pair them
let buckets={};PAIRS.forEach((p,i)=>{let w=myPicks['p'+i];if(w)(buckets[p[4]]=buckets[p[4]]||[]).push(w)});
bracketQueue=[];Object.values(buckets).forEach(list=>{for(let i=0;i<list.length;i+=2){if(list[i+1])bracketQueue.push({id:'b'+bracketQueue.length,a:list[i],b:list[i+1],ea:'🏆',eb:'🏆',bucket:'bracket'});else bracketQueue.push({id:'b'+bracketQueue.length,a:list[i],b:'(bye)',ea:'🏆',eb:'⭐',bucket:'bracket'})}});
phase='bracket';if(!bracketQueue.length){alert('Play Round 1 first to build your bracket.');phase='pairs';currentIdx=0}
}
function startFinalOrEnd(){alert('Bracket round done! Your champions advance. Play again for a new season.');showSlot()}
function updateSimilarity(){let shared=Object.keys(myPicks).filter(k=>partnerPicks[k]);if(!shared.length){$('simPct').textContent='—';return}let same=shared.filter(k=>myPicks[k]===partnerPicks[k]).length;let pct=Math.round(same/shared.length*100);$('simPct').textContent=pct+'%';$('simBar').style.width=pct+'%';$('heartIcon').textContent=pct>=80?'💞':pct>=50?'💖':pct>=25?'💛':'🤍';if(pct>=80)unlockBadge('Twin Minds')}
// --- slot, capsule, nudge, bracket view ---
function showSlot(){$('slotCard').classList.remove('hidden');}
$('spinBtn').onclick=()=>{let sym=['❤️','⭐','🐵','🍀','🎵'];let r=()=>sym[Math.floor(Math.random()*sym.length)];let reels=[r(),r(),r()];$('slotReels').textContent=reels.join(' ');sfx('pop');let win=reels[0]===reels[1]||reels[1]===reels[2];$('slotMsg').textContent=win?'Bonus! +20 XP, capsule coin earned.':'Nice spin! +5 XP';addXp(win?20:5);if(win)showCapsule()};
function showCapsule(){$('capsuleCard').classList.remove('hidden')}
let coinPlaced=false;
$('coin').onpointerdown=e=>{coinPlaced=true;$('capsuleMsg').textContent='🪙';sfx('tap')};
$('leverBtn').onclick=()=>{if(!coinPlaced){$('capsuleMsg').textContent='🪙';return}$('capsuleBox').classList.add('rumble');sfx('pop');setTimeout(()=>{$('capsuleBox').classList.remove('rumble');$('capsuleBox').textContent='🥚';$('capsuleMsg').innerHTML='Capsule out! Tap it to open. <button id="openCap">Open</button>';$('openCap').onclick=()=>{let prizes=['🧣 Scarf','🎩 Hat','🌸 Flower','👑 Crown','🕶️ Glasses','🎀 Bow'];let p=prizes[Math.floor(Math.random()*prizes.length)];$('capsuleMsg').textContent=p;unlockBadge('Capsule: '+p);sfx('win');avatarReact('celebrate');}},800)};
$('bracketBtn').onclick=()=>{let b=$('bracketBox');b.classList.toggle('hidden');b.innerHTML='<p>'+(bracketQueue.length||'🏆')+'</p>'};
async function shareLink(){let url=location.href.split('?')[0]+(roomId?'?room='+roomId:'');let text='Your turn in Popularity Contest!';if(navigator.share){try{await navigator.share({title: "Popularity Contest",text,url});return}catch(e){}}
try{await navigator.clipboard.writeText(text+' '+url);alert('Link copied — paste it into Messages.')}catch(e){location.href='sms:?body='+encodeURIComponent(text+' '+url)}}
$('shareBtn').onclick=shareLink;$('nudgeBtn').onclick=shareLink;
// --- friends, messaging, spoiler-free newsfeed ---
let friends=JSON.parse(localStorage.getItem('tot_friends')||'[]');let chats=JSON.parse(localStorage.getItem('tot_chats')||'{}');let currentFriend=null;
function saveFriends(){localStorage.setItem('tot_friends',JSON.stringify(friends));localStorage.setItem('tot_chats',JSON.stringify(chats));renderFriends();renderFeed();}
function renderFriends(){let el=$('friendsList');if(!friends.length){el.innerHTML='';return}el.innerHTML=friends.map((f,i)=>`<button class="sec" onclick="openChat(${i})">👤 ${f}</button>`).join(' ')}
window.openChat=i=>{currentFriend=friends[i];$('chatBox').classList.remove('hidden');$('chatTitle').textContent='Chat with '+currentFriend;renderChat()};
function renderChat(){if(currentFriend==null)return;$('chatMsgs').innerHTML=(chats[currentFriend]||[]).map(m=>`<p>${m}</p>`).join('')||''}
function sendChat(text){if(currentFriend==null||!text)return;chats[currentFriend]=chats[currentFriend]||[];chats[currentFriend].push('You: '+text);saveFriends();renderChat();$('chatInput').value=''}
$('addFriendBtn').onclick=()=>{let n=$('friendName').value.trim();if(!n)return;if(!friends.includes(n))friends.push(n);$('friendName').value='';saveFriends();sfx('match')};
$('sendMsgBtn').onclick=()=>sendChat($('chatInput').value.trim());window.quickMsg=t=>sendChat(t);
function renderFeed(){
let total=Object.keys(myPicks).length,shared=Object.keys(myPicks).filter(k=>partnerPicks[k]).length,same=shared?Math.round(shared?Object.keys(myPicks).filter(k=>partnerPicks[k]&&myPicks[k]===partnerPicks[k]).length/shared*100:0):0;
let items=[];
items.push(`📊 You have made ${total} picks • Level ${level} • Streak ${streak} days`);
if(shared)items.push(`💞 Similarity with your partner: ${same}% over ${shared} shared matchups — no picks revealed here`);
if(badgesList.length)items.push(`🏅 Badges unlocked: ${badgesList.length} — ${badgesList.join(', ')}`);
items.push(`👥 Friends: ${friends.length}`);
$('feedBox').innerHTML=items.map(i=>`<p>${i}</p>`).join('')}
// hook feed into existing updates
let _origRender=render;render=function(){_origRender();renderFriends();renderFeed()};
renderFriends();renderFeed();
updateStreak();render();
</script></body></html>
