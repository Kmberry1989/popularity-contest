function nextCycleGame(){if(miniCycleIdx>=miniCycle.length){miniCycle=MINI_GAMES.map(g=>g.id).sort(()=>Math.random()-.5);miniCycleIdx=0;simonRound++}let g=miniCycle[miniCycleIdx++];return g}
function startCycleInterlude(){let g=nextCycleGame();if(g==='simon'){show('miniScreen');$('miniList').innerHTML='';playSimonCycle()}else{showMiniGames();playMini(g)}}
function playSimonCycle(){let el=$('miniPlay');el.innerHTML='<div>Simon first: '+simonRound+' beat'+(simonRound>1?'s':'')+'</div>';let colors=[['#ff5d5d',523],['#4caf50',659],['#4a90e2',784],['#ffd93d',1047]];let pattern=[];for(let i=0;i<simonRound;i++)pattern.push(Math.floor(Math.random()*4));let step=0;el.innerHTML+='<div id="simonMsg">Watch</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0">'+colors.map(function(c,i){return '<button class="simonbtn" data-i="'+i+'" style="height:100px;background:'+c[0]+';border-radius:18px;border:3px solid #fff;opacity:.6"></button>'}).join('')+'</div><button class="big" id="simonDoneBtn" style="display:none">Next Pairs</button>';let btns=el.querySelectorAll('.simonbtn');function light(i){let b=btns[i];b.style.opacity='1';beep(colors[i][1],.4,'sine',.12);setTimeout(function(){b.style.opacity='.6'},400)}pattern.forEach(function(v,idx){setTimeout(function(){light(v)},idx*700)});setTimeout(function(){document.getElementById('simonMsg').textContent='Your turn'},pattern.length*700);btns.forEach(function(b){b.onclick=function(){let i=+b.dataset.i;light(i);if(i===pattern[step]){step++;if(step===pattern.length){document.getElementById('simonMsg').textContent='Done!';document.getElementById('simonDoneBtn').style.display='block'}}else{document.getElementById('simonMsg').textContent='No big deal, try again';step=0}}});document.getElementById('simonDoneBtn').onclick=async()=>{await buildRun();runIdx=0;show('pairScreen');renderPair()}}
function playMini(id){let el=$('miniPlay');

if(id==='wordsearch'){el.innerHTML='<div>Grid: C O Z Y P<br>P I Z Z A X<br>W I N T E R Y</div><button class="big" onclick="this.textContent=\'Found COZY!\';beep(880,.3)">COZY</button> <button class="big" onclick="this.textContent=\'Found PIZZA!\';beep(880,.3)">PIZZA</button> <button class="big" onclick="this.textContent=\'Found WINTER!\';beep(880,.3)">WINTER</button>'}
else if(id==='howmany'){el.innerHTML='<div>From POPULARITY, type a word you found</div><input id="hwInput" placeholder="POP, ART..."><button class="big" onclick="document.getElementById(\'hwOut\').textContent=\'Nice! That counts.\'">Check</button><div id="hwOut"></div>'}
else if(id==='crossword'){el.innerHTML='<div>Warm drink (5 letters)</div><input id="cwInput" placeholder="COCOA"><button class="big" onclick="document.getElementById(\'cwOut\').textContent=(document.getElementById(\'cwInput\').value.toUpperCase()==\'COCOA\'?\'Correct!\':\'Try again, no loss\')">Check</button><div id="cwOut"></div>'}
else if(id==='difference'){el.innerHTML='<div>Tap the different one</div><button class="big" onclick="this.textContent=\'Same, try another\'">Cozy Blanket</button> <button class="big" onclick="this.textContent=\'That is the different one!\'">Pizza</button> <button class="big" onclick="this.textContent=\'Same, try another\'">Cozy Blanket</button>'}
else if(id==='oddone'){el.innerHTML='<div>Pizza, Burger, Taco, Snow Day - which does not belong?</div><button class="big" onclick="this.textContent=\'Right! Snow Day is not food\'">Snow Day</button> <button class="big" onclick="this.textContent=\'That is food, try another\'">Pizza</button>'}
else if(id==='sort'){el.innerHTML='<div>Sort items</div><button class="big" onclick="this.textContent=\'Blanket -> Cozy!\'">Blanket -> Cozy</button> <button class="big" onclick="this.textContent=\'Pizza -> Food!\'">Pizza -> Food</button> <button class="big" onclick="this.textContent=\'Snow -> Seasons!\'">Snow -> Seasons</button>'}
else if(id==='spotpair'){el.innerHTML='<div>Find the two matching</div><button class="big" onclick="this.textContent=\'Match!\';beep(880,.3)">Pizza</button> <button class="big" onclick="this.textContent=\'Match!\';beep(880,.3)">Pizza</button> <button class="big" onclick="this.textContent=\'Not a match\'">Cozy</button>'}
else if(id==='missing'){el.innerHTML='<div>Blanket, Pizza, Snow... one went missing. Which?</div><button class="big" onclick="this.textContent=\'Yes! Pizza went missing\'">Pizza</button> <button class="big" onclick="this.textContent=\'No, that one is still here\'">Blanket</button>'}
else if(id==='arrow'){el.innerHTML='<div>Tap the arrow that can go forward without hitting another line.</div><button class="big" onclick="this.textContent=\'It moved forward! Haul step 1/3\';beep(880,.3)">Right Arrow -></button> <button class="big" onclick="this.textContent=\'Blocked, try another\'">Up Arrow</button> <button class="big" onclick="this.textContent=\'Blocked, try another\'">Down Arrow</button><div>Clear all arrows to complete the haul: a truck full of pair items.</div>'}
else if(id==='ballsort'){el.innerHTML='<div>Sort balls by color</div><button class="big" onclick="this.textContent=\'Red ball sorted!\'">Red -> Red tube</button> <button class="big" onclick="this.textContent=\'Blue ball sorted!\'">Blue -> Blue tube</button> <button class="big" onclick="this.textContent=\'Green ball sorted!\'">Green -> Green tube</button>'}
else if(id==='scramble'){el.innerHTML='<div>Unscramble: YZOC</div><input id="scInput" placeholder="COZY"><button class="big" onclick="document.getElementById(\'scOut\').textContent=(document.getElementById(\'scInput\').value.toUpperCase()==\'COZY\'?\'Correct!\':\'Try again\')">Check</button><div id="scOut"></div>'}
else if(id==='connect'){el.innerHTML='<div>Tap letters in order: C O Z Y</div><button class="big" onclick="this.textContent=\'C!\'">C</button> <button class="big" onclick="this.textContent=\'O!\'">O</button> <button class="big" onclick="this.textContent=\'Z!\'">Z</button> <button class="big" onclick="this.textContent=\'Y! You spelled COZY\'">Y</button>'}
else if(id==='hammer'){let n=0;el.innerHTML='<div>Hammer the nail! Tap fast</div><div style="font-size:80px">🔨</div><div id="nail" style="font-size:40px">📌</div><div id="hammerMsg">Nail: 0%</div><button class="big" id="hammerBtn">Hammer!</button>';document.getElementById('hammerBtn').onclick=()=>{n+=20;beep(150,.1,'square',.12);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}document.getElementById('hammerMsg').textContent='Nail: '+n+'%';if(n>=100)document.getElementById('hammerMsg').textContent='Nailed it!'} }
else if(id==='balloon'){let size=60;el.innerHTML='<div>Hold the balloon to blow it up</div><div id="balloon" style="font-size:60px;transition:font-size .2s">🎈</div><div id="balloonMsg">Hold to blow</div>';let b=document.getElementById('balloon');let timer=null;b.addEventListener('pointerdown',()=>{timer=setInterval(()=>{size+=10;if(size>150){clearInterval(timer);document.getElementById('balloonMsg').textContent='Pop! Fun, try again';size=60}b.style.fontSize=size+'px';beep(400+size,.1)},100)});b.addEventListener('pointerup',()=>{clearInterval(timer);document.getElementById('balloonMsg').textContent='Nice size! Let go at the right time'}); }
else if(id==='paint'){let cov=0;el.innerHTML='<div>Drag across the wall to paint it</div><div id="wall" style="height:150px;background:#eee;border:3px solid #e8c9a0;border-radius:12px;position:relative;overflow:hidden"><div id="paintFill" style="position:absolute;left:0;top:0;height:100%;width:0%;background:#ff8a3d"></div></div><div id="paintMsg">Painted: 0%</div>';let w=document.getElementById('wall');let painting=false;w.addEventListener('pointerdown',()=>painting=true);w.addEventListener('pointerup',()=>painting=false);w.addEventListener('pointermove',()=>{if(!painting)return;cov=Math.min(100,cov+10);document.getElementById('paintFill').style.width=cov+'%';document.getElementById('paintMsg').textContent='Painted: '+cov+'%';if(cov>=100)document.getElementById('paintMsg').textContent='Wall painted!'}); }
else if(id==='simon'){playSimon(el)}
}

$('memoryDoneBtn').onclick=()=>{startCycleInterlude()};
function checkReveal(){let pairs=runPairs();if(finishedRun&&pairs.every(p=>myPicks[p.id]&&partnerPicks[p.id])){finishedRun=false;showReveal()}}
function showReveal(){let pairs=runPairs();let m=pairs.filter(pr=>myPicks[pr.id]&&partnerPicks[pr.id]&&myPicks[pr.id]===partnerPicks[pr.id]).length;saveStats({runs:1,matches:m});show('revealScreen');$('revealList').innerHTML='';drumRoll();pairs.forEach((p,i)=>{let you=myPicks[p.id],them=partnerPicks[p.id];let match=you===them;let row=document.createElement('div');row.className='revealrow';row.innerHTML=`${match?'<div class="spotlightbeam" style="left:30%"></div>':''}<div class="revealcard"><img src="${IMG[you]||''}"><div>You: ${you}</div></div><div class="revealcard"><img src="${IMG[them]||''}"><div>Them: ${them}</div></div>`;$('revealList').appendChild(row);setTimeout(()=>{if(match){trumpet();for(let c=0;c<20;c++){let el=document.createElement('div');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=['#ff8a3d','#ff5d8f','#4caf50','#ffd93d'][c%4];el.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),3000)}}else trombone()},1200+i*600)})}
$('playBtn').onclick=async()=>{guessMode=false;runCount++;badMode=(runCount%3===0);startBgm();await ensureRoom();syncRoom();runList=null;if(!badMode){await buildRun()}runIdx=0;show('pairScreen');renderPair()};
let showMore=()=>{show('moreScreen');renderSurvey();renderFriends();renderFeed()};if($('moreBtn'))$('moreBtn').onclick=showMore;$('moreBtn2').onclick=showMore;$('moreBtn3').onclick=showMore;
$('moreBackBtn').onclick=()=>show('menuScreen');
$('waitMenuBtn').onclick=()=>show('menuScreen');
$('revealMenuBtn').onclick=()=>show('menuScreen');
$('nextRunBtn').onclick=()=>{finishedRun=false;runList=null;startMemory()};
$('inviteBtn').onclick=async()=>{let url=location.href.split('?')[0]+(roomId?'?room='+roomId:'');let text='Play Popularity Contest with me!';if(navigator.share){try{await navigator.share({title:"Popularity Contest",text,url});return}catch(e){}}try{await navigator.clipboard.writeText(text+' '+url)}catch(e){location.href='sms:?body='+encodeURIComponent(text+' '+url)}};
$('checkBtn').onclick=()=>{syncRoom();setTimeout(checkReveal,500)};
function showGuessDone(){show('guessDoneScreen');$('guessDoneName').textContent=guessFriend;$('guessDoneList').innerHTML=guessPairs.map(pr=>`<div class="card"><img src="${IMG[guessPicks[pr.id]]||''}" style="width:100%;height:120px;object-fit:contain"><div style="font-weight:800">${guessPicks[pr.id]||''}</div></div>`).join('')}
$('guessBtn').onclick=()=>{let f=JSON.parse(localStorage.getItem('tot_friends')||'[]');if(!f.length)return;guessFriend=f[Math.floor(Math.random()*f.length)];guessMode=true;guessPicks={};let shuffled=[...PAIRS].sort(()=>Math.random()-.5).slice(0,5);guessPairs=shuffled.map((pr,i)=>({id:'g'+i,a:pr[0],b:pr[1],bucket:pr[4]}));startBgm();runIdx=0;show('pairScreen');renderPair()};
$('guessDoneMenuBtn').onclick=()=>{guessMode=false;show('menuScreen')};
function updateGuessBtn(){$('guessBtn').style.display='none'}
updateGuessBtn();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.querySelectorAll('img').forEach(im=>{im.draggable=false;im.addEventListener('contextmenu',e=>e.preventDefault())});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{let now=Date.now();if(now-lastTap<350)e.preventDefault();lastTap=now},{passive:false});
async function saveStats(extra={}){if(!db)return;try{let uid=user?.uid||'guest';let ref=doc(db,'thisorthat_public','stats-'+uid);let snap=await getDoc(ref);let d=snap.exists()?snap.data():{picks:0,matches:0,runs:0,streak:0};d.picks=(d.picks||0)+(extra.picks||0);d.matches=(d.matches||0)+(extra.matches||0);d.runs=(d.runs||0)+(extra.runs||0);d.updatedAt=Date.now();await setDoc(ref,d,{merge:true})}catch(e){}}
function renderSurvey(){let day=Math.floor(Date.now()/86400000);let q=SURVEYS[day%SURVEYS.length];let key='tot_survey_'+day;let ans=localStorage.getItem(key);$('surveyQ').textContent=q[0];$('surveyOpts').innerHTML=q[1].map((o,i)=>`<button ${ans?'disabled':''} onclick="window.answerSurvey(${i})">${o}</button>`).join('');$('surveyDone').textContent=ans?('Picked: '+q[1][ans]):''}
window.answerSurvey=i=>{let day=Math.floor(Date.now()/86400000);localStorage.setItem('tot_survey_'+day,String(i));renderSurvey()};
let friends=JSON.parse(localStorage.getItem('tot_friends')||'[]');let chats=JSON.parse(localStorage.getItem('tot_chats')||'{}');let currentFriend=null;
function renderFriends(){let el=$('friendsList');el.innerHTML=friends.map((f,i)=>`<button class="small" onclick="window.openChat(${i})">${f}</button>`).join(' ')||''}
window.openChat=i=>{currentFriend=friends[i];$('chatBox').style.display='block';$('chatTitle').textContent='Chat with '+currentFriend;$('chatMsgs').innerHTML=(chats[currentFriend]||[]).map(m=>`<p>${m}</p>`).join('')};
$('addFriendBtn').onclick=()=>{let n=$('friendName').value.trim();if(!n)return;if(!friends.includes(n))friends.push(n);localStorage.setItem('tot_friends',JSON.stringify(friends));$('friendName').value='';renderFriends();updateGuessBtn()};
$('sendMsgBtn').onclick=()=>{if(currentFriend==null)return;let t=$('chatInput').value.trim();if(!t)return;chats[currentFriend]=chats[currentFriend]||[];chats[currentFriend].push('You: '+t);localStorage.setItem('tot_chats',JSON.stringify(chats));$('chatInput').value='';window.openChat(friends.indexOf(currentFriend))};
function renderFeed(){let total=Object.keys(myPicks).length;$('feedBox').innerHTML=`<p>Picks made: ${total}</p><p>No picks revealed here.</p>`}
renderSurvey();
</script></body></html>
