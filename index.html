:'#4a90e2',frame:'img/frame-household-name.png',novelty:'img/frame-novelty-household-name.png'},{name:'Legend',min:51,max:999,color:'#d4af37',frame:'img/frame-legend.png',novelty:'img/frame-novelty-legend.png'}];function frameStyle(){try{return localStorage.getItem('tot_frame_style')||'colored'}catch(e){return 'colored'}}function statusSymbolForXp(xp){let l=xpLevel(xp);return STATUS_SYMBOLS.find(t=>l>=t.min&&l<=t.max)||STATUS_SYMBOLS[0]}
function updateXpPill(){let xp=getXP(),el=$('xpPill');if(el)el.textContent='Lv '+xpLevel(xp)+' · '+xp+' Popularity Points'}
function addXP(amount){if(!amount)return;let before=getXP(),after=before+amount;try{localStorage.setItem('tot_xp',String(after))}catch(e){};updateXpPill();saveStats({xp:amount});if(xpLevel(after)>xpLevel(before)){let t=$('xpToast');if(t){t.textContent='Level '+xpLevel(after)+'!';t.style.display='block';setTimeout(()=>t.style.display='none',1800)}}}
updateXpPill();window.addXP=addXP;
function showXpCollect(amount){sfx(1000,.12,'sine',.03,'xp');let el=$('xpCollect');if(!el)return;let img=$('xpCollectImg');if(img)img.style.display='none';let txt=$('xpCollectText');if(txt)txt.textContent='+'+amount;el.classList.remove('flying');el.style.display='block';setTimeout(()=>{el.classList.add('flying')},950);setTimeout(()=>{el.style.display='none';let bar=$('xpBarPop');if(!bar)return;let xp=getXP(),lvl=xpLevel(xp),pr=xpProgress(xp),into=pr.into;$('xpBarLabel').textContent='Level '+lvl+' · Popularity Points';$('xpBarText').textContent=xp+' Popularity Points · '+(pr.need-into)+' to Level '+(lvl+1);bar.classList.remove('show');bar.style.display='block';void bar.offsetWidth;bar.classList.add('show');sfx(1200,.12,'sine',.03,'xp');let fill=$('xpBarFill');fill.style.width='0%';setTimeout(()=>{fill.style.width=Math.round(into/pr.need*100)+'%'},60);setTimeout(()=>{bar.style.display='none'},2800)},1650)}

async function saveStats(extra={}){if(!db)return;try{let uid=user?.uid||'guest';let ref=doc(db,'thisorthat_public','stats-'+uid);let snap=await getDoc(ref);let d=snap.exists()?snap.data():{picks:0,matches:0,runs:0,streak:0};d.picks=(d.picks||0)+(extra.picks||0);d.matches=(d.matches||0)+(extra.matches||0);d.runs=(d.runs||0)+(extra.runs||0);d.xp=(d.xp||0)+(extra.xp||0);d.updatedAt=Date.now();await setDoc(ref,d,{merge:true})}catch(e){}}

function dailyDay(){return Math.floor(Date.now()/86400000)}
function getStreakInfo(){try{let last=parseInt(localStorage.getItem('tot_daily_last')||'0')||0;let streak=parseInt(localStorage.getItem('tot_daily_streak')||'0')||0;let longest=parseInt(localStorage.getItem('tot_daily_longest')||'0')||0;return {last,streak,longest}}catch(e){return {last:0,streak:0,longest:0}}}
function dailyDoneToday(){try{return !!localStorage.getItem('tot_survey_'+dailyDay())}catch(e){return false}}
function streakAssetDay(st){return ((st-1)%7)+1}
function streakCheckedToday(){let info=getStreakInfo();return info.last===dailyDay()}
function checkStreakOnLogin(){if(!(user&&user.photoURL))return {justChecked:false,oldStreak:getStreakInfo().streak};let day=dailyDay();let info=getStreakInfo();if(info.last===day)return {justChecked:false,oldStreak:info.streak};let oldStreak=info.streak;let newStreak=(info.last===day-1)?info.streak+1:1;let longest=Math.max(info.longest,newStreak);try{localStorage.setItem('tot_daily_last',String(day));localStorage.setItem('tot_daily_streak',String(newStreak));localStorage.setItem('tot_daily_longest',String(longest))}catch(e){};if(db&&user){try{setDoc(doc(db,'thisorthat_public','stats-'+user.uid),{streak:newStreak,updatedAt:Date.now()},{merge:true}).catch(()=>{})}catch(e){}}window._streakOldForAnim=oldStreak;return {justChecked:true,oldStreak}}
function pencilScratch(){if(!soundOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();let t=ctx.currentTime;let dur=.5;let buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*dur),ctx.sampleRate);let ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++){ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,.4)}let src=ctx.createBufferSource();src.buffer=buf;let bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=1.2;let g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.08);g.gain.linearRampToValueAtTime(.02,t+.18);g.gain.linearRampToValueAtTime(.05,t+.28);g.gain.linearRampToValueAtTime(0,t+dur);src.connect(bp);bp.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+dur)}catch(e){}}
function renderStreakRow(elId,curDay){let el=$(elId);if(!el)return;if(!(user&&user.photoURL)){el.innerHTML='';return}let h='';for(let d=1;d<=7;d++){let done=d<curDay||(d===curDay&&streakCheckedToday());let op=done?1:(d===curDay?1:0.35);let sc=d===curDay?1.15:1;let check=done?'<span class="checkdraw-wrap" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><svg class="checkdraw" viewBox="0 0 24 24"><path d="M4 12 L10 18 L20 6" fill="none" stroke="#2e9e4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>':'';h+=`<div style="text-align:center;opacity:${op}"><div style="position:relative;width:44px;height:44px;margin:0 auto;transform:scale(${sc})"><img src="img/clay-square.png" style="width:44px;height:44px;object-fit:contain">${check}</div><div style="font-weight:800;font-size:12px">Day ${d}</div></div>`}el.innerHTML=h}
function animateStreakCount(from,to){let el=$('streakCount');if(!el)return;if(from>=to){el.textContent='Day '+streakAssetDay(to)+' · '+to+' in a row';return}let cur=from;let iv=setInterval(()=>{cur++;el.textContent='Day '+streakAssetDay(cur)+' · '+cur+' in a row';try{sfx(900,.06,'sine',.02,'tap')}catch(e){};if(cur>=to)clearInterval(iv)},180)}
function showDailyIfNeeded(){if(window._dailyDoneSession)return false;if(location.search.indexOf('mini=')!==-1||location.search.indexOf('memory=')!==-1||location.search.indexOf('tourney=')!==-1)return false;if(dailyDoneToday())return false;if(!(user&&user.photoURL))return false;try{checkStreakOnLogin()}catch(e){};let info=getStreakInfo();let newStreak=info.streak||1;let oldStreak=(window._streakOldForAnim!==undefined&&window._streakOldForAnim!==null)?window._streakOldForAnim:info.streak;window._dailyNewStreak=newStreak;window._dailyOldStreak=oldStreak;window._streakOldForAnim=undefined;window._dailyPending=true;let assetDay=streakAssetDay(newStreak);let title=$('streakTitle');if(title)title.textContent='Day '+assetDay+' - Weekly Streak';renderStreakRow('streakRow',assetDay);let asset=$('streakAsset');if(asset){asset.src='img/trophy-optD.png';asset.style.display='block'}let cnt=$('streakCount');if(cnt)cnt.textContent='Day '+assetDay+' · '+newStreak+' in a row';show('streakScreen');pencilScratch();animateStreakCount(oldStreak,newStreak);setTimeout(()=>{if(!dailyDoneToday()){renderSurvey();show('dailyScreen')}},3000);return true}
window.answerDaily=i=>{try{window.answerSurvey(i)}catch(e){};window._dailyDoneSession=true;try{checkStreakOnLogin()}catch(e){};let day=dailyDay();let info=getStreakInfo();let newStreak=window._dailyNewStreak||info.streak||1;let longest=Math.max(info.longest,newStreak);try{localStorage.setItem('tot_daily_last',String(day));localStorage.setItem('tot_daily_streak',String(newStreak));localStorage.setItem('tot_daily_longest',String(longest))}catch(e){};let assetDay=streakAssetDay(newStreak);let reward=assetDay*5;try{window.addXP&&window.addXP(reward)}catch(e){};if(db&&user){try{setDoc(doc(db,'thisorthat_public','stats-'+user.uid),{streak:newStreak,updatedAt:Date.now()},{merge:true}).catch(()=>{})}catch(e){}}let rw=$('dailyReward');if(rw){rw.style.display='block';rw.textContent='+'+reward+' Popularity Points · Day '+assetDay+' streak'};renderStreakRow('streakRow',assetDay);setTimeout(()=>{if(window._dailyAfterPlay){window._dailyAfterPlay=false;window._dailyPending=false;let pb=$('playBtn');if(pb)pb.click();else show('menuScreen')}else show('menuScreen')},2800)};
function renderProfile(){let wrap=$('profileAvatarWrap');let av=$('profileAvatar');if(wrap){wrap.style.display=(user&&user.photoURL)?'block':'none'}if(av){if(user&&user.photoURL){av.src=user.photoURL;av.style.border='none';av.style.boxShadow='none'}else av.style.display='none'}let nm=$('profileName');if(nm)nm.textContent=(user&&user.displayName)?user.displayName:'Player';let lvl=$('profileLevel');if(lvl){let xp=getXP();lvl.textContent='Level '+xpLevel(xp)+' · '+xp+' Popularity Points'};let tierEl=$('profileTier');if(tierEl){let xp=getXP(),t=statusSymbolForXp(xp);tierEl.textContent=t.name;tierEl.style.color='#3b2a1e'}let fr=$('profileFrame');let fb=$('frameStyleBtn');if(fr){let t=statusSymbolForXp(getXP());let st=frameStyle();let src=(st==='novelty'&&t.novelty)?t.novelty:t.frame;fr.src=src;fr.style.display='block';fr.onerror=()=>{fr.style.display='none';if(av){av.style.border='4px solid '+t.color}};if(fb){if(t.novelty){fb.style.display='block';fb.textContent='Frame: '+(st==='novelty'?'Novelty':'Colored');fb.onclick=()=>{try{localStorage.setItem('tot_frame_style',st==='novelty'?'colored':'novelty')}catch(e){};renderProfile()}}else fb.style.display='none'}}let info=getStreakInfo();let psc=$('profileStreakCard');if(psc)psc.style.display=(user&&user.photoURL)?'block':'none';let fbc=$('profileFbCard');if(fbc)fbc.style.display=($('fbFriendsBox')&&$('fbFriendsBox').innerHTML.trim())?'block':'none';renderStreakRow('profileStreakRow',streakAssetDay(info.streak||1));let st=$('profileStreakText');if(st)st.textContent=info.streak?('Current streak: '+info.streak+' days · Longest: '+info.longest+' days'):'No streak yet — answer the daily question to start one';renderFriends();let stats=$('profileStats');if(stats){let total=Object.keys(myPicks).length;let per={cozy:0,food:0,nature:0,animals:0,color:0};Object.keys(myPicks).forEach(pid=>{let idx=parseInt(pid.slice(1));let pr=PAIRS[idx];if(pr&&pr[4]&&per.hasOwnProperty(pr[4]))per[pr[4]]++});let surveyCount=0;try{for(let k in localStorage){if(k.indexOf('tot_survey_')===0)surveyCount++}}catch(e){};let mini=parseInt(localStorage.getItem('tot_mini_played')||'0')||0;let maxBucket='—',maxN=0;Object.keys(per).forEach(b=>{if(per[b]>maxN){maxN=per[b];maxBucket=b}});let maxTotal=Math.max(1,total);let rows=Object.keys(per).map(b=>`<div style="display:flex;justify-content:space-between;font-weight:800"><span>${b}</span><span>${per[b]} picks</span></div><div style="height:10px;background:#ffe9c9;border-radius:5px;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:${Math.round(per[b]/maxTotal*100)}%;background:linear-gradient(90deg,#ff8a3d,#ff5d8f)"></div></div>`).join('');stats.innerHTML=`<div style="font-weight:800">Total picks: ${total}</div><div style="font-weight:800">Most picked: ${maxBucket}</div><div style="font-weight:800">Daily questions answered: ${surveyCount}</div><div style="font-weight:800">Mini games played: ${mini}</div><div style="margin-top:8px">${rows}</div><div id="profileFirestoreStats" style="font-weight:800;margin-top:8px">Matches / runs: loading…</div>`;if(db&&user){try{getDoc(doc(db,'thisorthat_public','stats-'+user.uid)).then(snap=>{let d=snap.exists()?snap.data():{};let el=$('profileFirestoreStats');if(el)el.textContent=`Matches: ${d.matches||0} · Runs: ${d.runs||0}`}).catch(()=>{})}catch(e){}}}}
function renderSurvey(){let day=Math.floor(Date.now()/86400000);let q=SURVEYS[day%SURVEYS.length];let key='tot_survey_'+day;let ans=localStorage.getItem(key);$('surveyQ').textContent=q[0];$('surveyOpts').innerHTML=q[1].map((o,i)=>`<button ${ans?'disabled':''} onclick="window.answerDaily(${i})">${o}</button>`).join('');$('surveyDone').textContent=ans?('Picked: '+q[1][ans]):''}
window.answerSurvey=i=>{let day=Math.floor(Date.now()/86400000);localStorage.setItem('tot_survey_'+day,String(i));try{window.addXP&&window.addXP(3)}catch(e){};renderSurvey()};
let friends=JSON.parse(localStorage.getItem('tot_friends')||'[]');let chats=JSON.parse(localStorage.getItem('tot_chats')||'{}');let currentFriend=null;
function renderFriends(){let el=$('friendsList');el.innerHTML=friends.map((f,i)=>`<button class="small" onclick="window.openChat(${i})">${f}</button>`).join(' ')||''}
window.openChat=i=>{currentFriend=friends[i];$('chatBox').style.display='block';$('chatTitle').textContent='Chat with '+currentFriend;$('chatMsgs').innerHTML=(chats[currentFriend]||[]).map(m=>`<p>${m}</p>`).join('')};
$('addFriendBtn').onclick=()=>{let n=$('friendName').value.trim();if(!n)return;if(!friends.includes(n))friends.push(n);localStorage.setItem('tot_friends',JSON.stringify(friends));$('friendName').value='';renderFriends();updateGuessBtn()};
$('sendMsgBtn').onclick=()=>{if(currentFriend==null)return;let t=$('chatInput').value.trim();if(!t)return;chats[currentFriend]=chats[currentFriend]||[];chats[currentFriend].push('You: '+t);localStorage.setItem('tot_chats',JSON.stringify(chats));$('chatInput').value='';window.openChat(friends.indexOf(currentFriend))};
function renderFeed(){if(!$('feedBox'))return;let total=Object.keys(myPicks).length;$('feedBox').innerHTML=`<p>Picks made: ${total}</p><p>No picks revealed here.</p>`}
renderSurvey();renderFriends();

if(_memParam){setTimeout(()=>{show('memoryScreen');startMemory()},300);}

if(_miniParam&&MINI_GAMES.some(g=>g.id===_miniParam)){setTimeout(()=>{show('miniScreen');if(_miniParam==='simon'){playSimonCycle()}else{playMini(_miniParam)}},300);}
else if(_miniParam){setTimeout(()=>{show('menuScreen')},300);}
